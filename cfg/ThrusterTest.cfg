#!/usr/bin/env python
PACKAGE = "sensorless_force_control"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("force",          double_t, 0, "Body-frame force  [N]  — linear  channels (1-3), used with use_tcm=True", 0.0, -20.0, 20.0)
gen.add("torque",         double_t, 0, "Body-frame torque [Nm] — angular channels (4-6), used with use_tcm=True", 0.0, -10.0, 10.0)
gen.add("thruster_force", double_t, 0, "Direct thruster force [N] — applied to selected channel, used with use_tcm=False", 0.0, -90.0, 90.0)
gen.add("channel",        int_t,    0, "Target channel: 1-3 linear (surge/sway/heave), 4-6 angular (roll/pitch/yaw)", 1, 1, 6)
gen.add("enable",         bool_t,   0, "Enable: send commands to thruster topic", False)
gen.add("use_tcm",        bool_t,   0, "True: body wrench -> TCM^+ -> thrusters;  False: thruster_force direct to channel", False)

exit(gen.generate(PACKAGE, "sensorless_force_control", "ThrusterTest"))
